[package]
name = "simple_kvm"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
axum = "0.8.9"
jpeg-encoder = "0.7.1"
openh264 = "0.9.8"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
serialport = "4.9.0"
tokio = { version = "1.53.1", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
v4l = "0.14.0"
wtransport = "0.7.2"
