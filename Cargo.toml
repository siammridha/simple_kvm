[workspace]
members = ["lib/libva-rs"]

[package]
name = "simple_kvm"
version = "0.4.3"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
async-trait = "0.1.89"
axum = "0.8.9"
bytes = "1.12.0"
libc = "0.2.169"
rtc = "0.20.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
serialport = { version = "4.9.0", default-features = false }
libva-rs = { path = "lib/libva-rs" }
tokio = { version = "1.53.1", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
v4l = "0.14.0"
webrtc = "0.20.3"
