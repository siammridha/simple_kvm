<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>simple_kvm</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<div id="video-surface" tabindex="0">
  <video id="video-el" autoplay playsinline muted></video>
</div>

<div id="topbar">
  <button id="topbar-handle" aria-label="Show controls">
    <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"></polyline></svg>
  </button>

  <span id="status">connecting&hellip;</span>

  <button id="mouse-toggle-button" aria-label="Disable mouse" aria-pressed="false">
    <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3l7.07 16.97 2.51-7.39 7.39-2.51L3 3z"></path><path d="M13 13l6 6"></path><path class="disabled-slash" d="M4 20L20 4"></path></svg>
  </button>

  <button id="settings-button" aria-label="Settings">
    <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
  </button>

  <button id="paste-button" aria-label="Paste text">
    <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"></path><rect x="8" y="2" width="8" height="4" rx="1" ry="1"></rect></svg>
  </button>

  <span id="version"></span>
</div>

<div id="settings-panel">
  <label>Frame rate
    <select id="frame-rate"></select>
  </label>

  <label>Resolution
    <select id="resolution"></select>
  </label>

  <label>Bitrate
    <select id="bitrate">
      <option value="500000">500 Kbps</option>
      <option value="1000000">1 Mbps</option>
      <option value="1500000">1.5 Mbps</option>
      <option value="2000000" selected>2 Mbps</option>
      <option value="2500000">2.5 Mbps</option>
      <option value="3000000">3 Mbps</option>
      <option value="3500000">3.5 Mbps</option>
      <option value="4000000">4 Mbps</option>
      <option value="4500000">4.5 Mbps</option>
      <option value="5000000">5 Mbps</option>
    </select>
  </label>

  <label>Mouse
    <select id="mouse-mode">
      <option value="absolute">Absolute</option>
      <option value="relative">Relative</option>
    </select>
  </label>

  <div class="panel-actions">
    <button id="save-settings" disabled>Save settings</button>
    <span id="save-settings-status"></span>
  </div>
</div>

<div id="paste-panel">
  <textarea id="paste-text" placeholder="Paste here to type it on the target (US QWERTY only)"></textarea>
</div>

<!--SERVER_CONFIG-->
<script src="/app.js"></script>
</body>
</html>
